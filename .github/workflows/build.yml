name: Build RECORA (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg (has ddagrab + QSV / NVENC / AMF / MF)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $exe = Get-ChildItem ffmpeg_dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName ffmpeg.exe
          if (-not (.\ffmpeg.exe -hide_banner -filters | Select-String "ddagrab")) { throw "ddagrab missing in this FFmpeg build" }
          .\ffmpeg.exe -hide_banner -encoders | Select-String "h264_qsv|h264_nvenc|h264_amf|h264_mf|libx264"

      - name: Build RECORA.exe
        run: pyinstaller --noconfirm --clean --windowed --name RECORA --icon recora.ico --add-data "recora.ico;." recora.py

      - name: Put ffmpeg.exe next to RECORA.exe
        shell: pwsh
        run: |
          Copy-Item ffmpeg.exe dist\RECORA\ffmpeg.exe
          Copy-Item README.md dist\RECORA\README.md

      - uses: actions/upload-artifact@v4
        with:
          name: RECORA-windows
          path: dist/RECORA
